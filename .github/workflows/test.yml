name: Test

on:
  push:
    branches: [ main, claude/zombie-cafe-game-cgBCq ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save jsdom
      - run: node --test test/smoke.test.js
