name: Build Undead Diner iOS IPA (unsigned)

# Builds the React + Phaser app, wraps it with Capacitor, and publishes an
# UNSIGNED .ipa to the "undead-diner-ios-latest" release for self-signing.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/2d-game-recreation-CEGJF
    paths:
      - 'undead-diner/**'
      - '.github/workflows/undead-diner-ios.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: undead-diner

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate app icon & splash
        run: npx @capacitor/assets generate --ios --assetPath assets || echo "asset generation skipped"

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Archive app (no code signing)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          cd build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/App.app
          zip -qry UndeadDiner-unsigned.ipa Payload
          ls -lh UndeadDiner-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: UndeadDiner-unsigned-ipa
          path: undead-diner/build/UndeadDiner-unsigned.ipa
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete undead-diner-ios-latest --cleanup-tag --yes || true
          gh release create undead-diner-ios-latest "build/UndeadDiner-unsigned.ipa" \
            --title "Undead Diner — iOS (unsigned IPA)" \
            --notes "Unsigned IPA built on a GitHub macOS runner. Download, sign with your tool (AltStore / Sideloadly / signing service), then install. App ID: com.undeaddiner.game"
