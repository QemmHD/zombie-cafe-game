name: Get Unity Activation File (.alf)

# Run this once to generate the Unity activation request file (.alf).
# Download the "Unity Activation File" artifact from the run, upload it at
# https://license.unity3d.com/manual to get your .ulf license, then paste the
# .ulf contents into a repo secret named UNITY_LICENSE.

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/request-activation-file@v2

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 1
