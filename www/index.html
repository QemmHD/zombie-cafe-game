<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zombie Cafe" />
  <meta name="theme-color" content="#0b0f0c" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: gap: capacitor:; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; media-src 'self' blob:;" />
  <title>Zombie Cafe</title>
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="hud"></header>
    <main id="floor">
      <section id="kitchen-wrap">
        <h2 class="section-label">🔪 Kitchen</h2>
        <div id="kitchen" class="stations"></div>
      </section>
      <section id="dining-wrap">
        <h2 class="section-label">🍽️ Dining Room</h2>
        <div id="dining" class="tables"></div>
      </section>
    </main>
    <nav id="toolbar">
      <button class="tool" data-action="open-shop">🛒<span>Shop</span></button>
      <button class="tool" data-action="open-recipes">📖<span>Recipes</span></button>
      <button class="tool" data-action="open-help">❓<span>How</span></button>
    </nav>
  </div>
  <div id="fx"></div>
  <div id="modal-root"></div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
